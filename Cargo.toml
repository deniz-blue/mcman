[package]
name = "mcman"
version = "0.5.0"
edition = "2021"
rust-version = "1.97"
repository = "https://github.com/ParadigmMC/mcman"
homepage = "https://paradigmmc.github.io/mcman/"
authors = ["ParadigmMC"]
license = "gpl-3"
description = "Powerful Minecraft Server Manager CLI"
documentation = "https://paradigmmc.github.io/mcman/"
keywords = ["minecraft", "server"]
categories = ["command-line-utilities", "config"]

[profile.release]
opt-level = "s"
strip = true

[profile.release-lto]
inherits = "release"
lto = true

[profile.release-lto-thin]
inherits = "release"
lto = "thin"

[dependencies]
cached = "0.47"
clap = { version = "4.4", features = ["derive"] }
clap_complete = { version = "4.5", optional = true }
confique = { version = "0.2", default-features = false, features = ["toml"] }
console = "0.16"
dialoguer = "0.11"
digest = "0.10"
dirs = "5.0"
glob = "0.3"
hex = "0.4"
indexmap = { version = "2.1", features = ["serde"] }
indicatif = "0.18"
md-5 = "0.10"
notify-debouncer-full = { version = "0.3" }
opener = "0.8"
pathdiff = { git = "https://github.com/Manishearth/pathdiff.git" }
rpackwiz = { git = "https://github.com/vgskye/rpackwiz.git" }
regex = "1.10"
reqwest = { version = "0.12", features = [
	"json",
	"stream",
	"rustls-tls",
], default-features = false }
reqwest-middleware = "0.3"
reqwest-retry = "0.6"
roxmltree = "0.20"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.9"
tokio = { version = "1.35", features = [
	"macros",
	"rt",
	"rt-multi-thread",
	"process",
	"signal",
	"io-std",
] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
walkdir = "2.4"
zip = "0.6"
lazy_static = "1.5.0"
thiserror = "2.0.17"
blake3 = "1.8.5"
kdl = "6.3.4"
miette = { version = "7.6.0", features = ["fancy"] }

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
predicates = "3"
insta = "1"
miette = "7"

[features]
autocomplete = ["clap_complete"]
default = ["autocomplete"]
